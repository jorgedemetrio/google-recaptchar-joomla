name: Build

# Verificação rápida a cada push/PR: sintaxe PHP nas versões suportadas, JS e manifestos.
# O gate completo (idiomas, versões, estrutura) está em validacao-pre-master.yml.
on:
  push:
    branches:
      - master
      - release
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l (todos os .php do plugin)
        run: |
          find plugins -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: node --check (JavaScript do plugin)
        run: |
          find plugins -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Manifesto e asset registry são válidos
        run: |
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          ET.parse('plugins/plg_captcha_recaptcha/recaptcha.xml')
          json.load(open('plugins/plg_captcha_recaptcha/media/joomla.asset.json', encoding='utf-8'))
          print('recaptcha.xml e joomla.asset.json OK')
          PY

      - name: Empacotamento de teste (sem enviar)
        run: DRY_RUN=1 bash .github/scripts/deploy.sh v0.0.0-ci
