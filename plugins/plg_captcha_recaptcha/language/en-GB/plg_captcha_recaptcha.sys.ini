PLG_CAPTCHA_RECAPTCHA="Captcha - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="Google reCAPTCHA for Joomla 6 (checkbox v2, invisible v2 and v3). Get the keys at https://www.google.com/recaptcha/admin, choose this plugin as the default Captcha in Global Configuration and enable the Captcha field in the forms (registration, login, contact, reset)."
