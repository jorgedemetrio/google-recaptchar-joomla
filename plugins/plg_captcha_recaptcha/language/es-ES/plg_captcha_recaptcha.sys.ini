PLG_CAPTCHA_RECAPTCHA="Captcha - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="Google reCAPTCHA para Joomla 6 (casilla v2, invisible v2 y v3). Genere las claves en https://www.google.com/recaptcha/admin, elija este plugin como Captcha predeterminado en la Configuración global y active el campo Captcha en los formularios (registro, acceso, contacto, restablecer contraseña)."
