PLG_CAPTCHA_RECAPTCHA="Captcha - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="Google reCAPTCHA für Joomla 6 (Checkbox v2, unsichtbar v2 und v3). Schlüssel unter https://www.google.com/recaptcha/admin erstellen, dieses Plugin in der Globalen Konfiguration als Standard-Captcha wählen und das Captcha-Feld in den Formularen aktivieren (Registrierung, Anmeldung, Kontakt, Passwort zurücksetzen)."
