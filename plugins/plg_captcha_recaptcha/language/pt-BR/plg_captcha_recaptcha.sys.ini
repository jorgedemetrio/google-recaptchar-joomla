PLG_CAPTCHA_RECAPTCHA="Captcha - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="Google reCAPTCHA para o Joomla 6 (checkbox v2, invisível v2 e v3). Gere as chaves em https://www.google.com/recaptcha/admin, escolha este plugin como Captcha padrão na Configuração Global e habilite o campo Captcha nos formulários (cadastro, login, contato, redefinição de senha)."
