PLG_CAPTCHA_RECAPTCHA="Captcha - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="Google reCAPTCHA per Joomla 6 (casella v2, invisibile v2 e v3). Genera le chiavi su https://www.google.com/recaptcha/admin, scegli questo plugin come Captcha predefinito nella Configurazione globale e abilita il campo Captcha nei moduli (registrazione, accesso, contatto, reimpostazione della password)."
