PLG_CAPTCHA_RECAPTCHA="Captcha - Google reCAPTCHA"
PLG_CAPTCHA_RECAPTCHA_XML_DESCRIPTION="Google reCAPTCHA pour Joomla 6 (case à cocher v2, invisible v2 et v3). Générez les clés sur https://www.google.com/recaptcha/admin, choisissez ce plugin comme Captcha par défaut dans la Configuration globale et activez le champ Captcha dans les formulaires (inscription, connexion, contact, réinitialisation du mot de passe)."
